name: Deploy THREAD to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Restore approved THREAD vector assets
        env:
          WORDMARK_GZ: 
          MONOGRAM_GZ: 
        run: |
          mkdir -p public/brand
          printf '%s' "$WORDMARK_GZ" | base64 --decode | gzip -dc > public/brand/thread-wordmark.svg
          printf '%s' "$MONOGRAM_GZ" | base64 --decode | gzip -dc > public/brand/thread-monogram.svg
          cp public/brand/thread-monogram.svg public/favicon.svg
      - name: Build Vite project
        run: npm run build
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
